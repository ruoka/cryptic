name: C/C++ CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Only cancel superseded PR runs. Never cancel master mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup LLVM (shared)
        uses: ./.github/actions/setup-llvm

      - name: Verify std.cppm location
        run: |
          if [ -f /usr/lib/llvm-21/share/libc++/v1/std.cppm ]; then
            echo "std.cppm found at /usr/lib/llvm-21/share/libc++/v1/std.cppm"
          else
            echo "Warning: std.cppm not found at expected location"
            find /usr/lib/llvm-21 -name "std.cppm" 2>/dev/null || echo "std.cppm not found anywhere"
          fi

      - name: Build project
        run: ./tools/CB.sh debug build

      # Scope to cryptic tests only — unfiltered runs pull nested deps/tester
      # [self] JUnit probes that write temp reports and fail outside tester's
      # own tree. --jobs forwards to test_runner; --junit= writes an additive
      # xUnit report beside JSONL (see ruoka/tester CI).
      - name: Run tests
        run: |
          set -euo pipefail
          jobs="$(nproc)"
          echo "Running [cryptic] tests with --jobs=${jobs}"
          ./tools/CB.sh debug test --jsonl=failures --jobs="${jobs}" \
            --junit=test_results_debug.xml \
            --tags='\[cryptic\]' > test_results_debug.jsonl
          passed=$(jq -rs '[.[] | select(.type=="summary" or .type=="run_end")] | last | .passed' test_results_debug.jsonl)
          if [ "$passed" != "true" ]; then
            echo "Tests failed (summary.passed=$passed)"
            tail -20 test_results_debug.jsonl
            exit 1
          fi
          echo "✓ Tests passed (jobs=${jobs})"

      - name: Validate JSONL output
        run: |
          set -euo pipefail
          f=test_results_debug.jsonl
          if [ ! -f "$f" ]; then
            echo "ERROR: JSONL output file not found!"
            exit 1
          fi
          echo "JSONL lines ($f): $(wc -l < "$f")"
          if ! tail -1 "$f" | jq -e '.type == "eof"' >/dev/null; then
            echo "✗ EOF marker missing in $f — the stream was truncated"
            tail -5 "$f"
            exit 1
          fi
          echo "✓ EOF marker found"

      # show=all writes the test table into the job Summary on green runs too
      # (default show=fail leaves only a tiny SVG badge when everything passes).
      - name: Publish JUnit test summary
        uses: test-summary/action@v2
        if: always()
        with:
          show: all
          paths: test_results_debug.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-debug
          path: |
            test_results_debug.jsonl
            test_results_debug.xml

      - name: Build benchmark (release)
        # The benchmark lives under tests/, so make sure test targets are built in release mode.
        # --build-tests builds test targets but doesn't run them.
        run: ./tools/CB.sh release build --build-tests

      - name: Run benchmark (release, timed)
        run: |
          set -euo pipefail
          test -x ./build-linux-release/bin/benchmark
          # Ensure LLVM libc++ runtime is discoverable at runtime (Ubuntu runners don't always have it on the default loader path).
          export LD_LIBRARY_PATH="/usr/lib/llvm-21/lib:${LD_LIBRARY_PATH:-}"
          timeout 120s ./build-linux-release/bin/benchmark || {
            echo "benchmark failed; diagnostics:"
            ls -la ./build-linux-release/bin || true
            ldd ./build-linux-release/bin/benchmark || true
            exit 1
          }

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup LLVM + analysis tools
        uses: ./.github/actions/setup-llvm
        with:
          packages: "libc++-21-dev libc++abi-21-dev clang-21 lld-21 lldb-21 jq clang-tools-21 clang-tidy-21 cppcheck libssl-dev"

      - name: Run clang-tidy (non-blocking)
        run: |
          set -euo pipefail
          find cryptic -name "*.c++m" -o -name "*.c++" | head -20 | while read -r f; do
            echo "Analyzing $f"
            clang-tidy-21 "$f" -- -std=c++23 -I/usr/lib/llvm-21/include/c++/v1 2>/dev/null || true
          done

      - name: Run cppcheck (non-blocking)
        run: |
          cppcheck --enable=all --std=c++23 --language=c++ \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --inline-suppr \
            --quiet \
            cryptic/ tools/ tests/ 2>/dev/null || true

  submodule-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Check submodule status + clean tree
        run: |
          set -euo pipefail
          echo "=== Submodule Status ==="
          git submodule status || echo "No submodules"
          echo ""
          echo "=== Checking for uncommitted changes ==="
          if git status --porcelain | grep -q .; then
            echo "✗ Uncommitted changes found"
            git status --porcelain
            exit 1
          else
            echo "✓ Repo is clean"
          fi
